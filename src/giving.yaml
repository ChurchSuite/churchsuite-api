          example: true
        visible_in_tap_to_donate:
          description: Whether the Fund is shown in Tap to Donate or not.
          type: boolean
          example: true
        donate_frequency:
          description: The frequency of the donation.
          type: string
          enum:
            - oneoff
            - oneoff_recurring
            - recurring
          examples:
            - oneoff
            - oneoff_recurring
            - recurring
        tap_to_donate_amounts:
          description: >-
            The preset amounts in the smallest monetary unit available for this
            fund within the Tap to Donate app. If visible_in_tap_to_donate is
            true and there are no preset amounts in the request, the default
            amounts will be used.
          type: array
          items:
            type: integer
            minimum: 1
          example:
            - 500
            - 1000
            - 1500
            - 5000
          default:
            - 500
            - 1000
            - 2000
            - 3000
          maxItems: 4
        gift_aid:
          description: >-
            Whether Gift Aid can be claimed on this Fund, if your account can
            have Gift Aid applied to it. This is required if your account has
            Gift Aid enabled.
          type: boolean
          example: false
        tax_deductible:
          description: >-
            Whether this Fund is tax deductible, if your account's country has
            tax deductible giving. This is required if your account has tax
            deductible giving enabled.
          type: boolean
          example: true
        confirmation_email:
          description: Edit confirmation email details.
          type: object
          additionalProperties: false
          properties:
            sender_email:
              description: >-
                The sender's email address for the confirmation email. If not
                provided the Account no-reply email address will be used.
              type: string
              format: email
              example: admin@kingshopechurch.co.uk
              maxLength: 100
            sender_name:
              description: >-
                The sender's name for the confirmation email. If not provided
                the Account name will be used with a suffix of Giving.
              type: string
              example: Kings Hope Giving
              maxLength: 50
            subject:
              description: >-
                The subject for the confirmation email. If not provided the
                Account name will be used with the Fund's name.
              type: string
              example: '[Kings Hope Church] Building Fund'
              maxLength: 100
            body:
              description: >-
                The HTML body for the confirmation email. Available merge fields
                for the body are ::first_name::, ::last_name:: and ::email::.
              type: string
              example: >-
                <div>Dear ::first_name::,</div> <div>&nbsp;</div> <div>Here are
                your details!</div>
              maxLength: 65535
          required:
            - sender_email
            - sender_name
            - subject
            - body
        description:
          description: The description of the Fund.
          type: string
          example: This fund is for regular giving to the church in all areas.
          maxLength: 65535
      additionalProperties: false
      required:
        - name
        - color
        - brand_id
        - visible_in_donate
        - visible_in_tap_to_donate
        - donate_frequency
        - tap_to_donate_amounts
        - confirmation_email
        - description
    Giver:
      type: object
      properties:
        id:
          description: The Giver's ID.
          type: integer
          example: 12
          minimum: 1
        contact_id:
          description: The Contact ID, if the Giver is linked to a Contact.
          type:
            - integer
            - 'null'
          example: 256
          minimum: 1
        reference:
          description: The unique reference identifier for the Giver.
          type: string
          example: G-0128
        bank_references:
          description: An array of bank references for the Giver.
          type: array
          items:
            type: string
          example:
            - JaneSmith
            - JohnDoe
        first_name:
          description: The Giver's first name.
          type: string
          example: Kev
        last_name:
          description: The Giver's last name.
          type: string
          example: Bramley
        mobile:
          description: The mobile number of the Giver.
          type: string
          example: '07700700153'
        email:
          description: The email address of the Giver.
          type:
            - string
            - 'null'
          format: email
          example: kevbramley@kingshopechurch.com
        telephone:
          description: The phone number of the Giver.
          type: string
          example: '01154960231'
        is_couple:
          description: Whether the Giver is a couple or not.
          type: boolean
          example: true
        spouse_first_name:
          description: The spouse's first name, null if the giver is not a couple.
          type:
            - string
            - 'null'
          example: John
        spouse_last_name:
          description: The spouse's last name, null if the giver is not a couple.
          type:
            - string
            - 'null'
          example: Smith
        giftaid_percentage_giver:
          description: >-
            The percentage of giftaid contribution for the Giver, or null if the
            giver is not a couple or the account is not in the UK.
          type:
            - integer
            - 'null'
          example: 50
          maximum: 100
          minimum: 0
        giftaid_percentage_spouse:
          description: >-
            The percentage of giftaid contribution for the Giver's spouse, or
            null if the giver is not a couple or the account is not in the UK.
          type:
            - integer
            - 'null'
          example: 50
          maximum: 100
          minimum: 0
        first_donation_date:
          description: >-
            The date of the Give's first donation or null if no donations have
            been made.
          type:
            - string
            - 'null'
          format: date
          example: '2014-04-25'
        last_donation_date:
          description: >-
            The date of the Give's last donation or null if no donations have
            been made.
          type:
            - string
            - 'null'
          format: date
          example: '2024-08-17'
        site_ids:
          description: The Giver's site ID returned in a single item array.
          type: array
          items:
            type: integer
          example:
            - 1
          maxItems: 1
          minItems: 1
        address:
          description: A street Address.
          type:
            - object
            - 'null'
          additionalProperties: false
          properties:
            line_1:
              description: The first line of the Address
              type: string
              example: Floor 2
            line_2:
              description: The second line of the Address
              type: string
              example: 1 Broadway
            line_3:
              description: The third line of the Address
              type:
                - string
                - 'null'
              example: Lace Market
            city:
              description: The city of the Address
              type: string
              example: Nottingham
            county:
              description: The county of the Address
              type: string
              example: Nottinghamshire
            country:
              description: The country of the Address, in ISO3166 alpha 2 format
              type:
                - string
                - 'null'
              example: GB
              maxLength: 2
              minLength: 2
            postcode:
              description: The postcode of the Address
              type: string
              example: NG1 1PR
            latitude:
              description: The latitude of the Address, to 6 decimal places
              type:
                - number
                - 'null'
              format: float
              example: 52.952089
            longitude:
              description: The longitude of the Address, to 6 decimal places
              type:
                - number
                - 'null'
              format: float
              example: -1.1448
          required:
            - line_1
            - line_2
            - line_3
            - city
            - county
            - country
            - postcode
            - latitude
            - longitude
        custom_fields:
          description: Custom Field responses for this resource
          type: array
          items:
            type: object
            description: Custom Field responses for this resource
            properties:
              id:
                description: The ID of the Custom Field
                type: integer
                example: 1
              field_type:
                description: >-
                  A discriminator to determine the type of Custom Field this
                  response belongs to.
                type: string
                example: text
                enum:
                  - checkbox
                  - date
                  - email
                  - phone
                  - radio
                  - select
                  - text
                  - textarea
              value:
                oneOf:
                  - type: string
                    description: The raw value of a text, textarea, email, phone or date.
                    example: support@churchsuite.com
                  - type: object
                    description: >-
                      The UUID of the selected response for a radio or select
                      field.
                    example:
                      id: ffbfc9fd-4579-4370-9783-2e4390cd0e30
                    properties:
                      id:
                        description: The UUID
                        type: string
                        format: uuid
                        example: ffbfc9fd-4579-4370-9783-2e4390cd0e30
                        maxLength: 36
                        minLength: 36
                    required:
                      - id
                    additionalProperties: false
                  - type: array
                    description: >-
                      An array of objects which contains the UUIDs of the
                      selected responses for a checkbox field. If no checkboxes
                      are selected an empty array will be returned.
                    items:
                      type: object
                      description: >-
                        The UUID of the selected response for a radio or select
                        field.
                      example:
                        id: ffbfc9fd-4579-4370-9783-2e4390cd0e30
                      properties:
                        id:
                          description: The UUID
                          type: string
                          format: uuid
                          example: ffbfc9fd-4579-4370-9783-2e4390cd0e30
                          maxLength: 36
                          minLength: 36
                      required:
                        - id
                      additionalProperties: false
                  - type: 'null'
            required:
              - id
              - value
              - field_type
            additionalProperties: false
        status:
          description: Current status of the Giver.
          type: string
          example: active
          enum:
            - active
            - archived
        archived_at:
          description: Date and time the Giver's record was archived.
          type:
            - string
            - 'null'
          format: date-time
          example: '2014-04-25T10:10:32Z'
        created_at:
          description: Date and time the Giver's record was created.
          type:
            - string
            - 'null'
          format: date-time
          example: '2014-04-25T10:10:32Z'
        created_by:
          description: The user who created the Giver's record.
          type:
            - string
            - 'null'
          example: neil
        modified_at:
          description: Date and time the Giver's record was last modified.
          type:
            - string
            - 'null'
          format: date-time
          example: '2023-09-19T14:52:40Z'
        modified_by:
          description: The user who last modified the Giver's record.
          type:
            - string
            - 'null'
          example: anthony
      additionalProperties: false
      required:
        - id
        - contact_id
        - reference
        - bank_references
        - first_name
        - last_name
        - mobile
        - email
        - telephone
        - is_couple
        - spouse_first_name
        - spouse_last_name
        - giftaid_percentage_giver
        - giftaid_percentage_spouse
        - first_donation_date
        - last_donation_date
        - site_ids
        - address
        - custom_fields
        - status
        - archived_at
        - created_at
        - created_by
        - modified_at
        - modified_by
