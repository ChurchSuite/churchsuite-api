openapi: 3.2.0
info:
  version: 2.104.0
  title: Giving Module
  description: >-
    This module is designed to help manage the donations you receive and the
    givers who gave them. The Giving module also includes support for claiming
    Gift Aid (for UK customers only) and Tax Deductible donations (North
    America).
  termsOfService: https://churchsuite.com/terms-of-service/
  contact:
    email: support@churchsuite.com
servers:
  - url: https://api.churchsuite.com/v2
    description: Public API server
paths:
  /giving/batches:
    get:
      operationId: list_giving_batches
      summary: List batches
      description: Returns a list of batches
      parameters:
        - name: batch_ids[]
          in: query
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
        - $ref: '#/components/parameters/PaginationPage'
        - $ref: '#/components/parameters/PaginationPerPage'
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Batch'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                additionalProperties: false
                required:
                  - data
                  - pagination
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.read
      tags:
        - Donations
  /giving/claims:
    get:
      operationId: list_giving_claims
      summary: List claims
      description: Returns a list of Gift Aid claims (UK only)
      parameters:
        - name: claim_ids[]
          in: query
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
        - name: statuses[]
          in: query
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              example: pending
              enum:
                - complete
                - pending
                - processing
                - reviewed
                - submitted
        - $ref: '#/components/parameters/PaginationPage'
        - $ref: '#/components/parameters/PaginationPerPage'
        - $ref: '#/components/parameters/SiteIds'
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Claim'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                additionalProperties: false
                required:
                  - data
                  - pagination
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.read
      tags:
        - Claims
  /giving/custom_fields/{id}:
    parameters:
      - name: id
        in: path
        description: ID of the custom field to retrieve.
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      operationId: get_giving_custom_field
      summary: Get a custom field
      description: Retrieve a single custom field identified by ID.
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CustomField'
                additionalProperties: false
                required:
                  - data
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.read
      tags:
        - Custom Fields GI
  /giving/custom_fields:
    get:
      operationId: list_giving_custom_fields
      summary: List custom fields
      description: Returns a list of custom fields
      parameters:
        - $ref: '#/components/parameters/PaginationPage'
        - $ref: '#/components/parameters/PaginationPerPage'
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomField'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                additionalProperties: false
                required:
                  - data
                  - pagination
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.read
      tags:
        - Custom Fields GI
  /giving/declarations:
    get:
      operationId: list_declarations
      summary: List declarations
      description: Returns a list of declarations.
      parameters:
        - name: giver_ids[]
          in: query
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
        - name: fund_ids[]
          in: query
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
        - name: statuses[]
          in: query
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              example: active
              enum:
                - active
                - expired
                - future
            default:
              - active
        - $ref: '#/components/parameters/PaginationPage'
        - $ref: '#/components/parameters/PaginationPerPage'
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Declaration'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                additionalProperties: false
                required:
                  - data
                  - pagination
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.read
      tags:
        - Declarations
  /giving/donations:
    get:
      operationId: list_donations
      summary: List donations
      description: Returns a list of donations, sorted by the most recent first.
      parameters:
        - name: claim_ids[]
          in: query
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
        - name: fund_ids[]
          in: query
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
        - name: giver_ids[]
          in: query
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
        - name: pledge_ids[]
          in: query
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
        - name: before
          in: query
          description: Only include records before this date.
          schema:
            type: string
            format: date
            example: '2024-02-24'
        - name: after
          in: query
          description: Only include records after this date.
          schema:
            type: string
            format: date
            example: '2024-01-24'
        - name: giftaid_claimable
          in: query
          description: Filter records by the provided status.
          schema:
            type: boolean
            example: true
        - name: giftaid_claimed
          in: query
          description: Filter records by the provided status.
          schema:
            type: boolean
            example: true
        - name: q
          in: query
          description: >-
            Filter records with a fuzzy string match against the following
            properties: cheque_number, method, fund_name, giver_reference,
            giver_first_name, giver_last_name.
          schema:
            description: A URL encoded string.
            type: string
            example: Card
        - name: statuses[]
          in: query
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              example: pending
              enum:
                - active
                - deleted
                - pending
                - refunded
              default: active
        - $ref: '#/components/parameters/PaginationPage'
        - $ref: '#/components/parameters/PaginationPerPage'
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Donation'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                additionalProperties: false
                required:
                  - data
                  - pagination
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.read
      tags:
        - Donations
    post:
      operationId: create_giving_donation
      summary: Create a Donation
      description: Create a Donation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationAdd'
      responses:
        '201':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Donation'
                additionalProperties: false
                required:
                  - data
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.write
      tags:
        - Donations
  /giving/flows/{id}:
    parameters:
      - name: id
        in: path
        description: ID of the record to retrieve.
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      operationId: get_giving_flow
      summary: Get a flow
      description: Retrieve a single flow identified by ID.
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Flow'
                additionalProperties: false
                required:
                  - data
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.read
      tags:
        - Flows GI
  /giving/flows:
    get:
      operationId: list_giving_flows
      summary: List flows
      description: Returns a list of flows, sorted alphabetically by name.
      parameters:
        - $ref: '#/components/parameters/PaginationPage'
        - $ref: '#/components/parameters/PaginationPerPage'
        - name: status
          in: query
          description: Filter records by the provided status.
          schema:
            type: string
            example: active
            default: active
            enum:
              - active
              - archived
        - name: q
          in: query
          description: >-
            Filter records with a fuzzy string match against the following
            properties: name.
          schema:
            description: A URL encoded string.
            type: string
            example: wedding
            minLength: 1
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Flow'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                additionalProperties: false
                required:
                  - data
                  - pagination
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.read
      tags:
        - Flows GI
  /giving/flow_stages/{id}:
    parameters:
      - name: id
        in: path
        description: ID of the record to retrieve.
        required: true
        schema:
          type: integer
          format: int32
          example: 45
          minimum: 1
    delete:
      operationId: delete_giving_flow_stage
      summary: Delete a flow stage
      description: >-
        Delete a single stage identified by ID. When a stage is deleted, all
        actions and flow trackings linked to the stage will be deleted.
      responses:
        '204':
          description: Successfully deleted
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.write
      tags:
        - Flows GI
    get:
      operationId: get_giving_flow_stage
      summary: Get a flow stage
      description: Retrieve a single stage identified by ID.
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FlowStage'
                additionalProperties: false
                required:
                  - data
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.read
      tags:
        - Flows GI
    put:
      operationId: edit_giving_flow_stage
      summary: Update a flow stage
      description: Update a single stage identified by ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowStageEdit'
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FlowStage'
                additionalProperties: false
                required:
                  - data
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.write
      tags:
        - Flows GI
  /giving/flow_stages:
    get:
      operationId: list_giving_flow_stages
      summary: List flow stages
      description: Returns a list of stages.
      parameters:
        - $ref: '#/components/parameters/PaginationPage'
        - $ref: '#/components/parameters/PaginationPerPage'
        - name: flow_ids[]
          in: query
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FlowStage'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                additionalProperties: false
                required:
                  - data
                  - pagination
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.read
      tags:
        - Flows GI
    post:
      operationId: create_giving_flow_stage
      summary: Create a flow stage
      description: Create a stage for a flow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowStageAdd'
      responses:
        '201':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FlowStage'
                additionalProperties: false
                required:
                  - data
          links:
            EditFlowStageByID:
              operationId: edit_giving_flow_stage
              parameters:
                id: $response.body#/data/id
            GetFlowStageByID:
              operationId: get_giving_flow_stage
              parameters:
                id: $response.body#/data/id
            DeleteFlowStageByID:
              operationId: delete_giving_flow_stage
              parameters:
                id: $response.body#/data/id
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.write
      tags:
        - Flows GI
  /giving/flow_trackings/{id}:
    parameters:
      - name: id
        in: path
        description: ID of the record to retrieve.
        required: true
        schema:
          type: integer
          format: int32
          example: 45
          minimum: 1
    get:
      operationId: get_giving_flow_tracking
      summary: Get a flow tracking
      description: >-
        Retrieve a single flow tracking, linked to a person's process through a
        flow, identified by ID.
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FlowTracking'
                additionalProperties: false
                required:
                  - data
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.read
      tags:
        - Flows GI
    put:
      operationId: edit_giving_flow_tracking
      summary: Update a flow tracking
      description: >-
        Update a single flow tracking, linked to a person's process through a
        flow, identified by ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowTrackingEdit'
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FlowTracking'
                additionalProperties: false
                required:
                  - data
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.write
      tags:
        - Flows GI
    delete:
      operationId: delete_giving_flow_tracking
      summary: Delete a flow tracking
      description: >-
        Delete a single flow tracking, linked to a person's process through a
        flow, identified by ID.
      responses:
        '204':
          description: Successfully deleted
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.write
      tags:
        - Flows GI
  /giving/flow_trackings:
    get:
      operationId: list_giving_flow_trackings
      summary: List flow trackings
      description: >-
        Returns a list of flow trackings linked to people's progress through a
        flow.
      parameters:
        - $ref: '#/components/parameters/PaginationPage'
        - $ref: '#/components/parameters/PaginationPerPage'
        - name: due_before
          in: query
          description: Only include records that start before this date.
          schema:
            type: string
            format: date
            example: '2024-02-24'
        - name: due_after
          in: query
          description: Only include records that start after this date.
          schema:
            type: string
            format: date
            example: '2024-01-24'
        - name: flow_ids[]
          in: query
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
        - name: giver_ids[]
          in: query
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
        - name: stage_ids[]
          in: query
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FlowTracking'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                additionalProperties: false
                required:
                  - data
                  - pagination
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.read
      tags:
        - Flows GI
    post:
      operationId: create_giving_flow_tracking
      summary: Create a flow tracking
      description: >-
        Create a flow tracking, linked to a person's process through a flow,
        with the provided settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowTrackingAdd'
      responses:
        '201':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FlowTracking'
                additionalProperties: false
