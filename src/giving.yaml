            - full_access
        - oauth_token:
            - giving.read
      tags:
        - Tags GI
  /giving/tag_categories:
    get:
      operationId: list_giving_tag_categories
      summary: List tag categories
      description: Returns a list of tag categories, sorted alphabetically by name.
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TagCategory'
                additionalProperties: false
                required:
                  - data
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.read
      tags:
        - Tags GI
  /giving/tag_resources:
    delete:
      operationId: delete_giving_tag_resource
      summary: Delete a tag resource
      description: >-
        Delete a single tag resource identified by a giver ID and tag ID,
        unlinking a giver from a tag.
      parameters:
        - name: giver_id
          in: query
          description: Filter records by the provided ID.
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: tag_id
          in: query
          description: Filter records by the provided ID.
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '204':
          description: Successfully deleted
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.write
      tags:
        - Tags GI
    get:
      operationId: list_giving_tag_resources
      summary: List tag resources
      description: >-
        Returns a list of tag resources. A tag resource is the relational model
        linking a giver to a tag.
      parameters:
        - $ref: '#/components/parameters/PaginationPage'
        - $ref: '#/components/parameters/PaginationPerPage'
        - name: giver_ids[]
          in: query
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
        - name: tag_ids[]
          in: query
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TagResource'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                additionalProperties: false
                required:
                  - data
                  - pagination
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.read
      tags:
        - Tags GI
    post:
      operationId: create_giving_tag_resource
      summary: Create a tag resource
      description: Create a tag resource linking a giver to a tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagResourceAdd'
      responses:
        '201':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TagResource'
                additionalProperties: false
                required:
                  - data
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - giving.write
      tags:
        - Tags GI
components:
  parameters:
    PaginationPage:
      in: query
      name: page
      description: Page number of items to return
      schema:
        type: integer
        example: 2
        default: 1
        minimum: 1
    PaginationPerPage:
      in: query
      name: per_page
      description: Number of items to return per request
      schema:
        type: integer
        example: 10
        default: 50
        maximum: 250
        minimum: 1
    SiteIds:
      in: query
      name: site_ids[]
      description: >-
        Filter records to those matching values in the provided array. This
        filter uses the logical OR operator.
      schema:
        type: array
        items:
          type: integer
          format: int32
          minimum: 1
  schemas:
    Batch:
      type: object
      properties:
        id:
          description: The Batch's ID.
          type: integer
          example: 12
          minimum: 1
        name:
          description: The name of the Batch.
          type: string
          example: Special offering
        type:
          description: The Batch type.
          type: string
          example: manual
          enum:
            - manual
            - import
        created_at:
          description: Date and time the Batch was created in ISO 8601 UTC.
          type: string
          format: date-time
          example: '2014-04-25T10:10:32Z'
        created_by:
          description: The user who created the Batch.
          type: string
          example: kelly
        modified_at:
          description: Date and time the Batch was last modified in ISO 8601 UTC.
          type: string
          format: date-time
          example: '2023-09-19T14:52:40Z'
        modified_by:
          description: The user who last modified the Batch.
          type: string
          example: anthony
      additionalProperties: false
      required:
        - id
        - name
        - type
        - created_at
        - created_by
        - modified_at
        - modified_by
    Claim:
      type: object
      properties:
        id:
          description: The Claim's ID.
          type: integer
          example: 12
          minimum: 1
        name:
          description: The name of the Claim.
          type: string
          example: GA-YRZC
        site_ids:
          description: The Claim's site ID returned in a single item array.
          type: array
          items:
            type: integer
          example:
            - 1
          maxItems: 1
          minItems: 1
        starts_at:
          description: The start date of the Claim.
          type: string
          format: date
          example: '2014-04-25'
        ends_at:
          description: The end date of the Claim.
          type: string
          format: date
          example: '2014-04-26'
        funds:
          description: Fund details for this Claim
          type: object
          additionalProperties: false
          properties:
            fund_ids:
              description: An array of Fund IDs this Claim is linked to
              type: array
              items:
                type: integer
                example: 1
                minimum: 1
              example:
                - 1
                - 2
                - 5
              minItems: 1
            all_funds:
              description: Whether the Claim covers all funds.
              type: boolean
              example: false
          required:
            - fund_ids
            - all_funds
        methods:
          description: >-
            List of the giving Methods this Claim covers. Where an empty array
            is returned, the claim methods represented all methods that were
            available to the account on the date the claim was created.
          type: array
          items:
            type: string
          example:
            - bank
            - card
        num_donations:
          description: The number of donations included in this Claim.
          type: integer
          example: 12
          minimum: 1
        num_refunds:
          description: The number of refunds included in this Claim.
          type: integer
          example: 5
          minimum: 0
        total:
          description: >-
            The total amount of all donations included in the Claim, in the
            smallest unit of the account currency.
          type: integer
          example: 3999
          minimum: 1
        giftaid_total:
          description: >-
            The total (gross) Gift Aid amount included in the Claim, in the
            smallest unit of the account currency.
          type: integer
          example: 254
          minimum: 0
        giftaid_refund_total:
          description: >-
            The total amount of all refunds included in the Claim, in the
            smallest unit of the account currency.
          type: integer
          example: 199
          minimum: 0
        status:
          description: The current status of the Claim.
          type: string
          example: complete
          enum:
            - complete
            - pending
            - processing
            - reviewed
            - submitted
        claimed_at:
          description: >-
            Date and time the Claim was submitted in ISO 8601 UTC or null if the
            claim has not been submitted.
          type:
            - string
            - 'null'
          format: date-time
          example: '2014-04-25T10:10:32Z'
        claimed_by:
          description: >-
            The user who submitted the Claim or null if the claim has not been
            submitted.
          type:
            - string
            - 'null'
          example: kelly
        created_at:
          description: Date and time the Claim was created in ISO 8601 UTC.
          type: string
          format: date-time
          example: '2014-04-25T10:10:32Z'
        created_by:
          description: The user who created the Claim.
          type: string
          example: kelly
        modified_at:
          description: Date and time the Claim was last modified in ISO 8601 UTC.
          type: string
          format: date-time
          example: '2023-09-19T14:52:40Z'
        modified_by:
          description: The user who last modified the Claim.
          type: string
          example: anthony
      additionalProperties: false
      required:
        - id
        - name
        - site_ids
        - starts_at
        - ends_at
        - funds
        - methods
        - num_donations
        - num_refunds
        - total
        - giftaid_total
        - giftaid_refund_total
        - status
        - claimed_at
        - claimed_by
        - created_at
        - created_by
        - modified_at
        - modified_by
    CustomField:
      description: A Custom Field, as found in several modules
      type: object
      properties:
        id:
          description: The ID of the Custom Field.
          type: integer
          example: 1
        order:
          description: Order the Custom Field appears.
          type: integer
          example: 1
        type:
          description: The Custom Field type.
          type: string
          example: text
          enum:
            - text
            - textarea
            - checkbox
            - radio
            - select
            - date
            - email
            - phone
        name:
          description: Name of the Custom Field.
          type: string
          example: Receive weekly newsletter
        help:
          description: Some text to help explain the purpose of the field.
          type:
            - string
            - 'null'
          example: Tick if you would like to receive the weekly newsletter or not.
        options:
          description: >-
            Field types checkbox, radio or select - will contain options for the
            field
          type:
            - array
            - 'null'
          items:
            type: object
            properties:
              help:
                description: Help text describing the option.
                type: string
                example: >-
                  Selecting this option will opt you into receiving our weekly
                  newsletters.
              id:
                description: UUID of the option.
                type: string
                format: uuid
                example: ffbfc9fd-4579-4370-9783-2e4390cd0e30
              name:
                description: Name of the option.
                type: string
                example: Yes I would love to receive the newsletter!
              status:
                description: Status of the option.
                type: string
                example: active
                enum:
                  - active
                  - archived
            required:
              - id
              - name
              - status
            additionalProperties: false
        required:
          description: Whether the field is required or not.
          type: boolean
          example: true
        settings:
          description: Settings relating to My, Embed and Connect.
          type:
            - object
            - 'null'
          properties:
            my:
              description: My ChurchSuite and My Consent settings.
              type: object
              additionalProperties: false
              properties:
                editable:
                  description: Whether the field is editable in My.
                  type: boolean
                  example: false
                viewable:
                  description: Whether the field is viewable in My.
                  type: boolean
                  example: true
                required:
                  description: Whether the field is a required in My.
                  type: boolean
                  example: false
              required:
                - editable
                - viewable
                - required
            embed:
              description: Embed settings.
              type: object
              additionalProperties: false
              properties:
                editable:
                  description: Whether the field is editable in Embed.
                  type: boolean
                  example: false
                viewable:
                  description: Whether the field is viewable in Embed.
                  type: boolean
                  example: true
                required:
                  description: Whether the field is required in Embed.
                  type: boolean
                  example: false
              required:
                - editable
                - viewable
                - required
            connect:
              description: Connect settings.
              type: object
              additionalProperties: false
              properties:
                editable:
                  description: Whether the field is editable in Connect.
                  type: boolean
                  example: false
                viewable:
                  description: Whether the field is viewable in Connect.
                  type: boolean
                  example: true
                required:
                  description: Whether the field is required in Connect.
                  type: boolean
                  example: false
              required:
                - editable
                - viewable
                - required
        created_at:
          description: Date and time the Custom Field was created.
          type:
            - string
            - 'null'
          format: date-time
          example: '2022-11-17T16:48:13Z'
        created_by:
          description: The user who created the Custom Field.
          type:
            - string
            - 'null'
          example: import
        modified_at:
          description: Date and time the Custom Field was last modified.
          type:
            - string
            - 'null'
          format: date-time
          example: '2022-11-17T16:48:13Z'
        modified_by:
          description: The user who last modified the Custom Field.
          type:
            - string
            - 'null'
          example: import
      additionalProperties: false
      required:
        - id
        - order
        - type
        - name
        - help
        - options
        - required
        - settings
        - created_at
        - created_by
        - modified_at
        - modified_by
    Declaration:
      type: object
      properties:
        id:
          description: The Declaration's ID.
          type: integer
          example: 12
          minimum: 1
        giver_id:
          description: The ID of the Giver the Declaration is linked to.
          type: integer
          example: 87
          minimum: 1
        donation_id:
          description: The ID of the Donation the Declaration is linked to.
          type:
            - integer
            - 'null'
          example: 16
          minimum: 1
        funds:
          description: Fund details for this Declaration
          type: object
          additionalProperties: false
          properties:
            fund_ids:
              description: An array of Fund IDs this Declaration is linked to
              type: array
              items:
                type: integer
                example: 1
                minimum: 1
              example:
                - 1
                - 2
                - 5
              minItems: 1
            all_funds:
              description: Whether the Declaration covers all funds.
              type: boolean
              example: false
          required:
            - fund_ids
            - all_funds
        date_start:
          description: The start date of the Declaration.
          type: string
          format: date
          example: '2014-04-25'
        date_end:
          description: The end date of the Declaration.
          type:
            - string
            - 'null'
          format: date
          example: '2014-04-26'
        digitally_signed:
          description: The source of the digital signature for this Declaration.
          type:
            - string
            - 'null'
          example: donate
        status:
          description: The current status of the Declaration.
          type: string
          example: active
          enum:
            - active
            - expired
            - future
        created_at:
          description: Date and time the Declaration was created in ISO 8601 UTC.
          type: string
          format: date-time
          example: '2014-04-25T10:10:32Z'
        created_by:
          description: The user who created the Declaration.
          type: string
          example: kelly
        modified_at:
          description: Date and time the Declaration was last modified in ISO 8601 UTC.
          type: string
          format: date-time
          example: '2023-09-19T14:52:40Z'
        modified_by:
          description: The user who last modified the Declaration.
          type: string
          example: anthony
      additionalProperties: false
      required:
        - id
        - giver_id
        - donation_id
        - funds
        - date_start
        - date_end
        - digitally_signed
        - status
        - created_at
        - created_by
        - modified_at
        - modified_by
    Donation:
      type: object
      properties:
        id:
          description: The Donation's ID.
          type: integer
          example: 12
          minimum: 1
        batch_id:
          description: >-
            The ID of the Batch the Donation is linked to, or null if it isn't
            linked one.
          type:
            - integer
            - 'null'
          example: 1226
          minimum: 1
        giver_id:
          description: The ID of the Giver the Donation is linked to.
          type: integer
          example: 87
          minimum: 1
        fund_id:
          description: The ID of the Fund the Donation is linked to.
          type: integer
          example: 7
          minimum: 1
        pledge_id:
          description: >-
            The ID of the Pledge the Donation is linked to, or null if it isn't
            linked one.
          type:
            - integer
            - 'null'
          example: 87
          minimum: 1
        claim_id:
          description: >-
            The ID of the Claim the Donation is linked to, or null if it isn't
            linked to one, or if the account is not in the UK.
          type:
            - integer
            - 'null'
          example: 365
          minimum: 1
        date:
          description: The date of the Donation.
          type: string
          format: date
          example: '2021-01-01'
        amount:
          description: The Donation amount, in the smallest unit of the account currency.
          type: integer
          example: 3999
        method:
          description: >-
            The method through which the Donation was made. Value must be either
            system-defined or a user-defined value from the module settings.
          type: string
          example: bank
        cheque_number:
          description: >-
            When method is cheque, the cheque number associated with the
            Donation.
          type:
            - string
            - 'null'
          example: '123456'
          maxLength: 20
        notes:
          description: The notes of the Donation.
          type:
            - string
            - 'null'
          example: Legacy gift
        giftaid:
          description: >-
            The Gift Aid details of the Donation, or null if the account is not
            in the UK.
          type:
            - object
            - 'null'
          additionalProperties: false
          properties:
            percentage_giver:
              description: >-
                The percentage of Gift Aid contribution for the Giver, or null
                if the Giver is not a couple.
              type:
                - integer
                - 'null'
              example: 20
            percentage_spouse:
              description: >-
                The percentage of Gift Aid contribution for the Giver's spouse,
                or null if the Giver is not a couple.
              type:
                - integer
                - 'null'
              example: 80
            claimable_amount:
              description: >-
                The amount of Gift Aid that is claimable for this Donation, in
                the smallest unit of the account currency, or null if the Giver
                does not have a declaration or overrode the declaration.
              type:
                - integer
                - 'null'
              example: 200
            claimed_amount:
              description: >-
                The amount of Gift Aid that has been claimed for this Donation,
                in the smallest unit of the account currency, or null if the
                Donation has not had Gift Aid claimed on it.
              type:
                - integer
                - 'null'
              example: 200
            refund_claim_id:
              description: >-
                The ID of the Claim the Donation's refunded Gift Aid has been
                processed in if the Gift Aid has been refunded, or null if the
                Gift Aid has not been refunded.
              type:
                - integer
                - 'null'
              example: 365
            refund_amount:
              description: >-
                The amount of Gift Aid that has been refunded for this Donation,
                in the smallest unit of the account currency, or null if the
                Gift Aid has not been refunded.
              type:
                - integer
                - 'null'
              example: 200
            overridden:
              description: >-
                Indicates when Gift Aid has been overridden for the Donation.
                When true, the Donation should not be subject to Gift Aid, even
                when a covering declaration exists.
              type: boolean
              example: false
          required:
            - percentage_giver
            - percentage_spouse
            - claimable_amount
            - claimed_amount
            - refund_claim_id
            - refund_amount
            - overridden
        tax_deductible:
          description: >-
            Whether the Donation is tax deductible. Null for accounts outside of
            AU, CA, HK and US.
          type:
            - boolean
            - 'null'
          example: true
        gateway:
          description: >-
            For donations processed through a payment gateway, null if a payment
            gateway has not been used.
          type:
            - object
            - 'null'
          additionalProperties: false
          properties:
            service:
              description: The payment gateway used for the Donation.
              type: string
              example: Stripe
            status:
              description: >-
                The last reported status for the Donation, as reported by the
                payment gateway.
              type:
                - string
                - 'null'
              example: paid
            payout_id:
              description: >-
                The payment gateway's payout ID for the Donation, null if the
                Donation has not been paid out.
              type:
                - string
                - 'null'
              example: PO000019JL29J1
            fees:
              description: >-
                The total amount of fees for the Donation, in the smallest unit
                of the account currency.
              type:
                - integer
                - 'null'
              example: 113
            paid_out_at:
              description: >-
                Date and time the payment gateway reported the Donation was paid
                out.
              type:
                - string
                - 'null'
              format: date
              example: '2023-09-19'
            modified_at:
              description: >-
                Date and time the payment gateway last reported a change to the
                Donation.
              type:
                - string
                - 'null'
              format: date-time
              example: '2023-09-19T14:52:40Z'
          required:
            - service
            - status
            - payout_id
            - fees
            - paid_out_at
            - modified_at
        status:
          description: The current status of the Donation.
          type: string
          example: active
          enum:
            - active
            - deleted
            - pending
            - refunded
        created_at:
          description: Date and time the Donation was created.
          type:
            - string
            - 'null'
          format: date-time
          example: '2014-04-25T10:10:32Z'
        created_by:
          description: The user who created the Donation.
          type:
            - string
            - 'null'
          example: kelly
        created_source:
          description: Where the Donation was created.
          type:
            - string
            - 'null'
          example: Donate
        modified_at:
          description: Date and time the Donation was last modified.
          type:
            - string
            - 'null'
          format: date-time
          example: '2023-09-19T14:52:40Z'
        modified_by:
          description: The user who last modified the Donation.
          type:
            - string
            - 'null'
          example: anthony
      additionalProperties: false
      required:
        - id
        - batch_id
        - giver_id
        - fund_id
        - pledge_id
        - claim_id
        - date
        - amount
        - method
        - cheque_number
        - notes
        - giftaid
        - tax_deductible
        - gateway
        - status
        - created_at
        - created_by
        - created_source
        - modified_at
        - modified_by
    DonationAdd:
      type: object
      properties:
        batch_id:
          description: The ID of the Batch the Donation is linked to.
