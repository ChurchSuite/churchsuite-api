  responses:
    '400':
      description: Invalid request.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: integer
                    enum:
                      - 400
                  errors:
                    type: object
                    example:
                      first_name: This field is required.
                      ticket_id: This ticket_id is invalid for this event.
                    additionalProperties:
                      oneOf:
                        - type: string
                        - type: object
                          additionalProperties:
                            type: string
                  message:
                    type: string
                    example: There were validation errors with the data you provided.
                required:
                  - status
                  - errors
                  - message
            additionalProperties: false
            required:
              - error
    '401':
      description: >-
        Unauthorized - the credentials provided are incorrect or no longer
        active.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: integer
                    enum:
                      - 401
                  message:
                    type: string
                    example: Unauthorized
                required:
                  - status
                  - message
            additionalProperties: false
            required:
              - error
    '403':
      description: Forbidden - you do not have permission to access this resource.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: integer
                    enum:
                      - 403
                  message:
                    type: string
                    example: You do not have sufficient permissions for this action
                required:
                  - status
                  - message
            additionalProperties: false
            required:
              - error
    '404':
      description: Not Found - the resource or API endpoint cannot be found.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: integer
                    enum:
                      - 404
                  message:
                    type: string
                    example: Not Found
                required:
                  - status
                  - message
            additionalProperties: false
            required:
              - error
    '409':
      description: Conflict.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: integer
                    enum:
                      - 409
                  errors:
                    type: object
                    example:
                      name: >-
                        A category with this name already exists. Please choose
                        a different name.
                    additionalProperties:
                      type: string
                  message:
                    type: string
                    example: >-
                      A conflict exists that prevents your request from being
                      completed.
                required:
                  - status
                  - message
            additionalProperties: false
            required:
              - error
    '429':
      description: Too Many Requests - the rate limit has been exceeded.
      headers:
        Retry-After:
          description: Number of seconds until the rate limiting period expires
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: integer
                    enum:
                      - 429
                  message:
                    type: string
                    example: The rate limit has been exceeded.
                    enum:
                      - The rate limit has been exceeded.
                required:
                  - status
                  - message
            additionalProperties: false
            required:
              - error
