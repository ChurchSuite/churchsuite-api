tags:
  - name: Giving Module
    description: >-
      This module is designed to help manage the donations you receive and the
      givers who gave them. The Giving module also includes support for claiming
      Gift Aid (for UK customers only) and Tax Deductible donations (North
      America).
    externalDocs:
      description: >-
        Explore our large database of online support articles for step-by-step
        help.
      url: >-
        https://support.churchsuite.com/article/455-getting-started-with-the-giving-module
  - name: Claims
    parent: Giving Module
    description: Manage your Gift Aid claims (UK only).
    externalDocs:
      description: >-
