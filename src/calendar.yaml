  /calendar/signups:
    get:
      summary: List sign-ups
      description: Returns a list of sign-ups, sorted by ID.
      operationId: list_signups
      parameters:
        - in: query
          name: event_id
          description: Filter records by the provided ID.
          schema:
            type: integer
            format: int32
            minimum: 1
        - in: query
          name: status
          description: Filter records by the provided status.
          schema:
            type: string
            example: active
            enum:
              - active
              - cancelled
              - refunded
              - reserved
            default: active
        - $ref: '#/components/parameters/PaginationPage'
        - $ref: '#/components/parameters/PaginationPerPage'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - calendar.read
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Signup'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                  - data
                  - pagination
                additionalProperties: false
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Sign-Ups
    post:
      summary: Create a signup
      description: Create a signup with the provided settings.
      operationId: create_calendar_signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SignupAddLinkedPerson'
                - $ref: '#/components/schemas/SignupAddNonLinkedPerson'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - calendar.write
      responses:
        '201':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Signup'
                required:
                  - data
                additionalProperties: false
          links:
            EditCategoryByID:
              operationId: edit_calendar_signup
              parameters:
                id: $response.body#/data/id
            DeleteCategoryByID:
              operationId: delete_calendar_signup
              parameters:
                id: $response.body#/data/id
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Sign-Ups
  /calendar/tickets:
    get:
      summary: List tickets
      description: Returns a list of tickets, sorted by ID.
      operationId: list_tickets
      parameters:
        - in: query
          name: event_id
          description: Filter records by the provided ID.
          schema:
            type: integer
            format: int32
            minimum: 1
        - $ref: '#/components/parameters/PaginationPage'
        - $ref: '#/components/parameters/PaginationPerPage'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - calendar.read
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ticket'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                  - data
                  - pagination
                additionalProperties: false
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Tickets
components:
  parameters:
    PaginationPage:
      in: query
      name: page
      description: Page number of items to return
      schema:
        type: integer
        example: 2
        minimum: 1
        default: 1
    PaginationPerPage:
      in: query
      name: per_page
      description: Number of items to return per request
      schema:
        type: integer
        example: 10
        minimum: 1
        maximum: 250
        default: 50
  responses:
    '400':
      description: Invalid request.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                      - 400
                  errors:
                    type: object
                    example:
                      first_name: This field is required.
                      ticket_id: This ticket_id is invalid for this event.
                    additionalProperties:
                      oneOf:
                        - type: string
                        - type: object
                          additionalProperties:
                            type: string
                  message:
                    type: string
                    example: There were validation errors with the data you provided.
                required:
                  - status
                  - errors
                  - message
                additionalProperties: false
            required:
              - error
            additionalProperties: false
    '401':
      description: >-
        Unauthorized - the credentials provided are incorrect or no longer
        active.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                      - 401
                  message:
                    type: string
                    example: Unauthorized
                required:
                  - status
                  - message
                additionalProperties: false
            required:
              - error
            additionalProperties: false
    '403':
      description: Forbidden - you do not have permission to access this resource.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                      - 403
                  message:
                    type: string
                    example: You do not have sufficient permissions for this action
                required:
                  - status
                  - message
                additionalProperties: false
            required:
              - error
            additionalProperties: false
    '404':
      description: Not Found - the resource or API endpoint cannot be found.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                      - 404
                  message:
                    type: string
                    example: Not Found
                required:
                  - status
                  - message
                additionalProperties: false
            required:
              - error
            additionalProperties: false
    '409':
      description: Conflict.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                      - 409
                  errors:
                    type: object
                    example:
                      name: >-
                        A category with this name already exists. Please choose
                        a different name.
                    additionalProperties:
                      type: string
                  message:
                    type: string
                    example: >-
                      A conflict exists that prevents your request from being
                      completed.
                required:
                  - status
                  - message
                additionalProperties: false
            required:
              - error
            additionalProperties: false
    '429':
      description: Too Many Requests - the rate limit has been exceeded.
      headers:
        Retry-After:
          description: Number of seconds until the rate limiting period expires
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                      - 429
                  message:
                    type: string
                    example: The rate limit has been exceeded.
                    enum:
                      - The rate limit has been exceeded.
                required:
                  - status
                  - message
                additionalProperties: false
            required:
              - error
            additionalProperties: false
  schemas:
    Category:
      type: object
      description: A single Category from the Calendar module.
      properties:
        id:
          type: integer
          minimum: 1
          description: The Category's ID.
          example: 12
        name:
          type: string
          description: The Category's name.
          example: Family
        color:
          type: string
          description: The Category's hexadecimal colour value.
          example: '#ab12cd'
        brand_id:
          type: integer
          minimum: 1
          description: The Brand ID linked to the Category.
          example: 1
        status:
          type: string
          description: The current status of the Category
          example: active
          enum:
            - active
            - archived
        archived_at:
          type:
            - string
            - 'null'
          description: Date and time the Category was archived.
          format: date-time
          example: '2014-04-25T10:10:32Z'
        created_at:
          type:
            - string
            - 'null'
          description: Date and time the Category was created.
          format: date-time
          example: '2014-04-25T10:10:32Z'
        created_by:
          type:
            - string
            - 'null'
          description: The user who created the Category.
          example: neil
        modified_at:
          type:
            - string
            - 'null'
          description: Date and time the Category was last modified.
          format: date-time
          example: '2023-09-19T14:52:40Z'
        modified_by:
          type:
            - string
            - 'null'
          description: The user who last modified the Category.
          example: anthony
      required:
        - id
        - name
        - color
        - brand_id
        - status
        - archived_at
        - created_at
        - created_by
        - modified_at
        - modified_by
      additionalProperties: false
    CategoryWrite:
      type: object
      properties:
        name:
          type: string
          description: The Category's name.
          example: Family
          maxLength: 50
          minLength: 1
        color:
          type: string
          description: The Category's hexadecimal colour value.
          example: '#ab12cd'
          pattern: ^#([a-f0-9]{6})$
        brand_id:
          type: integer
          minimum: 1
          description: The Brand ID linked to the Category.
          example: 18
      required:
        - name
        - color
        - brand_id
      additionalProperties: false
    Event:
      type: object
      description: A single Event from the Calendar module.
      properties:
        id:
          type: integer
          minimum: 1
          description: The Event's ID.
          example: 12
        identifier:
          type: string
          description: The unique identifier for the Event.
          example: gi8fj4sj
        sequence_id:
          type:
            - integer
            - 'null'
          minimum: 1
          description: The Event's sequence ID.
          example: 213
        brand_id:
          type: integer
          minimum: 1
          description: The Brand ID linked to the Event.
          example: 1
        booking_id:
          type:
            - integer
            - 'null'
          minimum: 1
          description: >-
            If the Event is linked to a Booking, the Booking's ID, otherwise
            null.
          example: 1
        name:
          type: string
          description: The Event's name.
          example: Gibson's Wedding
        starts_at:
          type: string
          description: Date and time the Event starts.
          format: date-time
          example: '2018-01-01T10:00:00Z'
        ends_at:
          type: string
          description: Date and time the Event ends.
          format: date-time
          example: '2018-01-01T11:00:00Z'
        status:
          type: string
          description: The current status of the Event.
          example: confirmed
          enum:
            - confirmed
            - cancelled
            - pending
        description:
          type: string
          description: The description of the Event.
          example: The reception of John Gibson and Anita Davis.
        category_id:
          type: integer
          description: The Event's category ID.
          example: 25
        visibility:
          type: object
          description: Event visibility settings
          properties:
            my:
              type: object
              description: Visibility settings for My ChurchSuite
              properties:
                visible:
                  type: boolean
                  description: Whether the Event is visible in My ChurchSuite at all.
                  example: true
                visible_to_all_contacts:
                  type: boolean
                  description: Whether the Event is visible to all contacts
                  example: true
                visible_to_all_children:
                  type: boolean
                  description: Whether the Event is visible to all children
                  example: true
                visible_to:
                  type: array
                  description: List of tags who can view this Event.
                  example:
                    - id: 12
                      module: addressbook
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: The Tag ID
                        minimum: 1
                        example: 12
                      module:
                        type: string
                        description: The Tag module
                        enum:
                          - addressbook
                          - children
                        example: children
                    required:
                      - id
                      - module
                    additionalProperties: false
                featured_events:
                  type: boolean
                  description: >-
                    Whether the Event should be shown in featured events in My
                    ChurchSuite.
                  example: true
              required:
                - visible
                - visible_to_all_contacts
                - visible_to_all_children
                - visible_to
                - featured_events
              additionalProperties: false
            embed:
              type: boolean
              description: Whether the Event is visible in Embed.
              example: true
            connect:
              type: boolean
              description: Whether the Event is visible in Connect.
              example: true
          required:
            - my
            - embed
            - connect
          additionalProperties: false
        signup_options:
          type:
            - object
            - 'null'
          description: Sign-Up options for the Event, or null if sign-up is not enabled.
          properties:
            capacity:
              type:
                - integer
                - 'null'
              description: The maximum number of people who can sign up for the Event.
              example: 200
            sequence_signup:
              type: boolean
              description: >-
                If selected, all sign-ups will be saved against the Event
                sequence rather than the individual Event.
              example: true
            my_signup:
              type: boolean
              description: Whether this Event can be signed up to in My.
              example: true
            embed_signup:
              type: boolean
              description: Whether this Event can be signed up to in Embed/Connect.
              example: true
            allow_cancel:
              type: boolean
              description: Whether a person can cancel a Sign-Up to this Event.
              example: true
            confirmation_email:
              type: object
              description: Confirmation email details.
              properties:
                sender_email:
                  type: string
                  format: email
                  description: The sender's email address for the confirmation email.
                  example: admin@kingshopechurch.co.uk
                sender_name:
                  type: string
                  description: The sender's name for the confirmation email.
                  example: Kings Hope Booking
                subject:
                  type: string
                  description: The subject for the confirmation email.
                  example: You're booked!
                body:
                  type: string
                  description: The html body for the confirmation email.
                  example: >-
                    <div>Dear ::first_name::,</div> <div>&nbsp;</div> <div>Here
                    are your details!</div>
              required:
                - sender_email
                - sender_name
                - subject
                - body
              additionalProperties: false
          required:
            - capacity
            - sequence_signup
            - my_signup
            - embed_signup
            - allow_cancel
            - confirmation_email
          additionalProperties: false
        image:
          type:
            - object
            - 'null'
          description: A collection of different sized variations of an Image.
          properties:
            thumbnail:
              type: string
              format: url
              description: The thumbnail Image url. Thumbnail images are 128x128px.
              example: >-
                https://cdn.churchsuite.com/abcdefgh/smallgroups/groups/x_thumb.jpg
            small:
              type: string
              format: url
              description: The small resolution Image url
              example: https://cdn.churchsuite.com/abcdefgh/smallgroups/groups/x_sm.jpg
            medium:
              type: string
              format: url
              description: The medium resolution Image url
              example: https://cdn.churchsuite.com/abcdefgh/smallgroups/groups/x_md.jpg
            large:
              type: string
              format: url
              description: The large resolution Image url
              example: https://cdn.churchsuite.com/abcdefgh/smallgroups/groups/x_lg.jpg
            uploaded_at:
              type:
                - string
                - 'null'
              format: date-time
              description: Date and time the Image was uploaded at.
              example: '2014-04-25T10:10:32Z'
          required:
            - thumbnail
            - small
            - medium
            - large
            - uploaded_at
          additionalProperties: false
        location:
          type:
            - object
            - 'null'
          description: The location of the Event or Group, whether in-person or online.
          properties:
            name:
              type: string
              description: The name of the location.
              example: Zoom
            type:
              type: string
              description: Whether the Event or Group is online or at a physical location.
              example: online
              enum:
                - online
                - physical
            address:
              type:
                - string
                - 'null'
              description: The location address.
              example: NG1 1PR
            latitude:
              type:
                - number
                - 'null'
              format: float
              description: The latitude of the address, to 6 decimal places
              example: 52.952089
            longitude:
              type:
                - number
                - 'null'
              format: float
              description: The longitude of the address, to 6 decimal places
              example: -1.1448
            url:
              type:
                - string
                - 'null'
              description: The url of the online location.
              example: https:zoom.us/123456789
          required:
            - name
            - type
            - address
            - latitude
            - longitude
            - url
          additionalProperties: false
        all_sites:
          type: boolean
          description: Whether the Event belongs to all sites or not.
          example: false
        site_ids:
          type: array
          description: List of all site IDs the Event belongs to.
          example:
            - 2
            - 7
            - 16
          items:
            type: integer
        created_at:
          type:
            - string
            - 'null'
          description: Date and time the Event was created.
          format: date-time
          example: '2014-04-25T10:10:32Z'
        created_by:
          type:
            - string
            - 'null'
          description: The user who created the Event.
          example: neil
        created_source:
          type:
            - string
            - 'null'
          description: The source of the Event - for example, an import CSV filename.
          example: neil
        modified_at:
          type:
            - string
            - 'null'
          description: Date and time the Event was last modified.
          format: date-time
          example: '2023-09-19T14:52:40Z'
        modified_by:
          type:
            - string
            - 'null'
          description: The user who last modified the Event.
          example: anthony
      required:
        - id
        - identifier
        - sequence_id
        - brand_id
        - name
        - starts_at
        - ends_at
        - status
        - description
        - category_id
        - visibility
        - signup_options
        - image
        - location
        - all_sites
        - site_ids
        - created_at
        - created_by
        - created_source
        - modified_at
        - modified_by
      additionalProperties: false
    Invite:
      type: object
      description: A single Event Invite from the Calendar module.
      properties:
        id:
          type: integer
          minimum: 1
          description: The Invite's ID.
          example: 12
        event_id:
          type: integer
          minimum: 1
          description: The Invite's Event ID.
