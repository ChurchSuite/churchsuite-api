openapi: 3.2.0
info:
  version: 2.101.0
  title: Calendar Module
  description: Manage events, sign-ups and staff leave across your account.
  termsOfService: https://churchsuite.com/terms-of-service/
  contact:
    email: support@churchsuite.com
servers:
  - url: https://api.churchsuite.com/v2
    description: Public API server
tags:
  - name: Calendar Module
    description: Manage events, sign-ups and staff leave across your account.
    externalDocs:
      description: >-
        Explore our large database of online support articles for step-by-step
        help.
      url: >-
        https://support.churchsuite.com/article/532-getting-started-with-the-calendar-module
  - name: Categories
    parent: Calendar Module
    description: >-
      Organise your events using categories, e.g. "Family events",
      "Discipleship", etc.
    externalDocs:
      description: >-
        Explore our large database of online support articles for step-by-step
        help.
      url: https://support.churchsuite.com/article/102-event-categories
  - name: Events
    parent: Calendar Module
    description: Manage your organisation's events.
    externalDocs:
      description: >-
        Explore our large database of online support articles for step-by-step
        help.
      url: >-
        https://support.churchsuite.com/article/98-adding-events-to-your-church-calendar
  - name: Invites
    parent: Calendar Module
    description: Manage your organisation's event invites.
    externalDocs:
      description: >-
        Explore our large database of online support articles for step-by-step
        help.
      url: https://support.churchsuite.com/article/460-event-invitations
  - name: Sign-Ups
    parent: Calendar Module
    description: >-
      When a person signs up to attend an event, a sign-up is created for them.
      A sign-up may be linked to a contact, child or be standalone and only
      exist in reference to that event.
    externalDocs:
      description: >-
        Explore our large database of online support articles for step-by-step
        help.
      url: >-
        https://support.churchsuite.com/article/193-adding-custom-question-to-event-sign-up
  - name: Tickets
    parent: Calendar Module
    description: >-
      Add tickets to an event to provide sign-ups with a choice of options,
      which may have an optional cost or capacity.
    externalDocs:
      description: >-
        Explore our large database of online support articles for step-by-step
        help.
      url: >-
        https://support.churchsuite.com/article/337-adding-tickets-to-your-events
paths:
  /calendar/categories/{id}:
    parameters:
      - name: id
        in: path
        description: ID of the record to retrieve.
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      summary: Get a category
      description: Retrieve a single category identified by ID.
      operationId: get_category
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - calendar.read
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
                required:
                  - data
                additionalProperties: false
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Categories
    delete:
      summary: Delete a category
      description: >-
        Delete a single category identified by ID. When a category is deleted,
        all events linked must be transferred to another category.
      operationId: delete_category
      parameters:
        - in: query
          name: replacement_id
          description: >-
            The ID of the replacement record. All events linked to the record
            being deleted will be moved to the replacement record.
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
            example: 21
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - calendar.write
      responses:
        '204':
          description: Successfully deleted
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Categories
    put:
      summary: Update a category
      description: Update a single category identified by ID.
      operationId: edit_category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWrite'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - calendar.write
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
                required:
                  - data
                additionalProperties: false
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Categories
  /calendar/categories:
    get:
      summary: List categories
      description: Returns a list of categories, sorted alphabetically by name.
      operationId: list_categories
      parameters:
        - $ref: '#/components/parameters/PaginationPage'
        - $ref: '#/components/parameters/PaginationPerPage'
        - in: query
          name: status
          description: Filter records by the provided status.
          schema:
            type: string
            example: active
            enum:
              - active
              - archived
            default: active
        - in: query
          name: q
          description: >-
            Filter records with a fuzzy string match against the following
            properties: name.
          schema:
            type: string
            description: A URL encoded string.
            example: Christmas Events
            minLength: 1
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - calendar.read
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                  - data
                  - pagination
                additionalProperties: false
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Categories
    post:
      summary: Create a category
      description: Create a category with the provided settings.
      operationId: create_category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWrite'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - calendar.write
      responses:
        '201':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
                required:
                  - data
                additionalProperties: false
          links:
            EditCategoryByID:
              operationId: edit_category
              parameters:
                id: $response.body#/data/id
            GetCategoryByID:
              operationId: get_category
              parameters:
                id: $response.body#/data/id
            DeleteCategoryByID:
              operationId: delete_category
              parameters:
                id: $response.body#/data/id
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Categories
  /calendar/events/{id}:
    parameters:
      - name: id
        in: path
        description: ID of the record to retrieve.
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      summary: Get an event
      description: Retrieve a single event identified by ID.
      operationId: get_event
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - calendar.read
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Event'
                required:
                  - data
                additionalProperties: false
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Events
    delete:
      summary: Delete an event
      description: Delete a single event identified by ID.
      operationId: delete_event
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - calendar.write
      responses:
        '204':
          description: Successfully deleted
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Events
    put:
      summary: Update an event
      description: Update a single event identified by ID.
      operationId: edit_event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Edit an Event in the Calendar module.
              allOf:
                - type: object
                  properties:
                    sequence_id:
                      type:
                        - integer
                        - 'null'
                      minimum: 1
                      description: >-
                        If the Event is part of a sequence, this field should
                        contain the sequence ID from an existing Event in the
                        sequence.
                      example: 213
                    name:
                      type: string
                      description: The Event's name.
                      example: Gibson's Wedding
                      maxLength: 50
                      minLength: 1
                    starts_at:
                      type: string
                      description: Date and time the Event starts.
                      format: date-time
                      example: '2018-01-01T10:00:00Z'
                    ends_at:
                      type: string
                      description: Date and time the Event ends.
                      format: date-time
                      example: '2018-01-01T11:00:00Z'
                    status:
                      type: string
                      description: The current status of the Event.
                      example: confirmed
                      enum:
                        - confirmed
                        - cancelled
                        - pending
                    description:
                      type: string
                      description: The description of the Event.
                      example: The reception of John Gibson and Anita Davis.
                      minLength: 0
                    category_id:
                      type: integer
                      description: The Event's category ID.
                      example: 25
                - oneOf:
                    - type: object
                      properties:
                        all_sites:
                          type: boolean
                          description: Whether the Event belongs to All Sites.
                          enum:
                            - true
                          example: true
                    - type: object
                      properties:
                        site_ids:
                          type: array
                          description: List of all site IDs the Event belongs to.
                          example:
                            - 2
                            - 7
                            - 16
                          items:
                            type: integer
              additionalProperties: false
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - calendar.write
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Event'
                required:
                  - data
                additionalProperties: false
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Events
  /calendar/events:
    get:
      summary: List events
      description: Returns a list of events, sorted by starts_at date.
      operationId: list_events
      parameters:
        - $ref: '#/components/parameters/PaginationPage'
        - $ref: '#/components/parameters/PaginationPerPage'
        - in: query
          name: category_ids[]
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
        - in: query
          name: q
          description: >-
            Filter records with a fuzzy string match against the following
            properties: name, starts_at.
          schema:
            type: string
            description: A URL encoded string.
            example: General Church Event
            minLength: 1
        - in: query
          name: sequence_id
          description: Filter records by the provided value.
          schema:
            type: integer
            format: int32
            example: 12
            minimum: 1
        - in: query
          name: starts_after
          description: Only include records that start after this date.
          schema:
            type: string
            format: date
            example: '2024-01-24'
        - in: query
          name: starts_before
          description: Only include records that start before this date.
          schema:
            type: string
            format: date
            example: '2024-02-24'
        - in: query
          name: status
          description: Filter records by the provided status.
          schema:
            type: string
            example: confirmed
            enum:
              - cancelled
              - confirmed
              - pending
            default: confirmed
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - calendar.read
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                  - data
                  - pagination
                additionalProperties: false
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Events
    post:
      summary: Create an event
      description: Create an event with the provided settings.
      operationId: create_event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Create an Event in the Calendar module.
              allOf:
                - type: object
                  properties:
                    sequence_id:
                      type:
                        - integer
                        - 'null'
                      minimum: 1
                      description: >-
                        If the Event is part of a sequence, this field should
                        contain the sequence ID from an existing Event in the
                        sequence.
                      example: 213
                    name:
                      type: string
                      description: The Event's name.
                      example: Gibson's Wedding
                      maxLength: 50
                      minLength: 1
                    starts_at:
                      type: string
                      description: Date and time the Event starts.
                      format: date-time
                      example: '2018-01-01T10:00:00Z'
                    ends_at:
                      type: string
                      description: Date and time the Event ends.
                      format: date-time
                      example: '2018-01-01T11:00:00Z'
                    status:
                      type: string
                      description: The current status of the Event.
                      example: confirmed
                      enum:
                        - confirmed
                        - cancelled
                        - pending
                    description:
                      type: string
                      description: The description of the Event.
                      example: The reception of John Gibson and Anita Davis.
                      minLength: 1
                    category_id:
                      type: integer
                      description: The Event's category ID.
                      example: 25
                  required:
                    - name
                    - starts_at
                    - ends_at
                    - status
                    - category_id
                - oneOf:
                    - type: object
                      properties:
                        all_sites:
                          type: boolean
                          description: Whether the Event belongs to All Sites.
                          enum:
                            - true
                          example: true
                      required:
                        - all_sites
                    - type: object
                      properties:
                        site_ids:
                          type: array
                          description: List of all site IDs the Event belongs to.
                          example:
                            - 2
                            - 7
                            - 16
                          items:
                            type: integer
                      required:
                        - site_ids
              additionalProperties: false
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - calendar.write
      responses:
        '201':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Event'
                required:
                  - data
                additionalProperties: false
          links:
            EditEventByID:
              operationId: edit_event
              parameters:
                id: $response.body#/data/id
            GetEventByID:
              operationId: get_event
              parameters:
                id: $response.body#/data/id
            DeleteEventByID:
              operationId: delete_event
              parameters:
                id: $response.body#/data/id
            CreateEventNote:
              operationId: create_event_note
              parameters:
                id: $response.body#/data/id
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Events
  /calendar/events/{id}/notes:
    parameters:
      - name: id
        in: path
        description: ID of the Event in question.
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
          example: 1129842
    get:
      summary: List event notes
      description: Returns a list of event notes, sorted by pinned, created_at.
      operationId: list_event_notes
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - calendar.read
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
                required:
                  - data
                additionalProperties: false
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Events
    post:
      summary: Create an event note
      description: Create a Note against an Event in the Calendar module.
      operationId: create_event_note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteAdd'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - calendar.write
      responses:
        '201':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
                required:
                  - data
                additionalProperties: false
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Events
  /calendar/invites/{id}:
    parameters:
      - name: id
        in: path
        description: ID of the record to retrieve.
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      summary: Get an invite
      description: Retrieve a single invite identified by ID.
      operationId: get_invite
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - calendar.read
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Invite'
                required:
                  - data
                additionalProperties: false
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Invites
  /calendar/invites:
    get:
      summary: List invites
      description: Returns a list of invites for an event, sorted by modified_at.
      operationId: list_invites
      parameters:
        - in: query
          name: child_ids[]
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
        - in: query
          name: contact_ids[]
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
        - in: query
          name: event_ids[]
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              type: integer
              format: int32
              minimum: 1
        - in: query
          name: statuses[]
          description: >-
            Filter records to those matching values in the provided array. This
            filter uses the logical OR operator.
          schema:
            type: array
            items:
              type: string
              example: accepted
              enum:
                - accepted
                - declined
                - not_sent
                - opened
                - pending
        - in: query
          name: q
          description: >-
            Filter records with a fuzzy string match against the following
            properties: contact_first_name, contact_last_name, child_first_name,
            child_last_name.
          schema:
            type: string
            description: A URL encoded string.
            example: Millie Hardingham
            minLength: 1
        - $ref: '#/components/parameters/PaginationPage'
        - $ref: '#/components/parameters/PaginationPerPage'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - calendar.read
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invite'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                  - data
                  - pagination
                additionalProperties: false
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Invites
  /calendar/signups/{id}:
    parameters:
      - name: id
        in: path
        description: ID of the record to retrieve.
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    delete:
      summary: Delete a sign-up
      description: Delete a single sign-up identified by an ID.
      operationId: delete_calendar_signup
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - calendar.write
      responses:
        '204':
          description: Successfully deleted
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
      tags:
        - Sign-Ups
    put:
      summary: Update a sign-up
      description: Update a single sign-up identified by ID.
      operationId: edit_calendar_signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SignupEditLinkedPerson'
                - $ref: '#/components/schemas/SignupEditNonLinkedPerson'
      security:
        - oauth_token:
            - full_access
        - oauth_token:
            - calendar.write
      responses:
        '200':
          description: OK Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
