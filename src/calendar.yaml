          readOnly: true
        modified_by:
          type:
            - string
            - 'null'
          description: The user who last modified the Note.
          example: anthony
          readOnly: true
      required:
        - id
        - content
        - pinned
        - visible_to
        - created_at
        - created_by
        - modified_at
        - modified_by
      additionalProperties: false
    NoteAdd:
